services:
  postgres:
    image: postgres:16-alpine
    container_name: rupsa-next-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rupsa
      POSTGRES_PASSWORD: rupsa
      POSTGRES_DB: rupsa_next
    ports:
      - "5432:5432"
    volumes:
      - rupsa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupsa -d rupsa_next"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rupsa_pg_data:
